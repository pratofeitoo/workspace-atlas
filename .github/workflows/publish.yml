name: Publish Workspace Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: .quartz-site
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: .quartz-site/.quartz/plugins
          key: quartz-plugins-${{ runner.os }}-${{ hashFiles('.quartz-site/quartz.lock.json') }}
      - run: npx quartz plugin install
      - run: bash stage-content.sh
      - run: npx quartz build
      - run: node fix-canvas-links.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz-site/public
      - uses: actions/deploy-pages@v4
        id: deploy
